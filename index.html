<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Let's build our future. 🚀">
    <meta name="author" content="Danny Vásconez">
    <title>Home | Danny Vásconez</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="stylesheets/base.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="container">

        <!-- Menú Flotante -->
        <nav class="main-menu">
            <div class="nav-links">
                <a href="index.html" class="active"><i class="bi bi-fingerprint"></i> BIO</a>
                <a href="resume.html"><i class="bi bi-person-circle"></i> CV</a>
                <a href="#" id="downloadPdfBtn" class="btn"><i class="bi-file-pdf"></i> Descargar</a>
            </div>
            <button class="theme-toggle" @click="handleToggleTheme">
                <i :class="isDarkMode ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'"></i>
                <span>{{ isDarkMode ? 'Claro' : 'Oscuro' }}</span>
            </button>
        </nav>

        <!-- Header -->
        <header v-if="profile">
            <h1 class="name">{{ profile.name }}</h1>
            <div class="contact-info">
                <span v-if="profile.email"><i class="bi bi-envelope-at"></i> <a :href="'mailto:' + profile.email">{{ profile.email }}</a></span>
                <span v-if="profile.linkedin"><i class="bi bi-linkedin"></i> <a :href="profile.linkedin" target="_blank">LinkedIn</a></span>
                <span v-if="profile.location"><i class="bi bi-geo-alt"></i> {{ profile.location }}</span>
            </div>
        </header>

        <!-- Quien soy -->
        <section class="section" v-if="profile && profile.bio">
            <h2>Quién soy</h2>
            <div class="experience-item">
                <p>{{ profile.bio }}</p>
            </div>
        </section>

        <!-- Badges Credly -->
        <section class="section" v-if="badges && badges.length">
            <h2>Badges</h2>
            <div v-for="badgeId in badges" 
                 :key="badgeId"
                 data-iframe-width="150" 
                 data-iframe-height="270" 
                 :data-share-badge-id="badgeId" 
                 data-share-badge-host="https://www.credly.com">
            </div>
        </section>

        <!-- Academia -->
        <section class="section" v-if="academic && academic.length">
            <h2>Academia</h2>
            <div class="badges-grid">
                <div v-for="(item, index) in academic" :key="index" class="cert_badge">
                    <a :href="item.href || '#'" target="_blank" rel="noopener noreferrer" class="cert_card">
                        <div class="cert_body">
                            <div class="cert_img_wrapper">
                                <img :src="item.logo" :alt="item.name" class="cert_img">
                            </div>
                            <div class="cert_container">
                                <div class="cert_name">{{ item.name }}</div>
                                <div class="cert_issuer" v-if="item.issuer">ISSUER: {{ item.issuer.toUpperCase() }}</div>
                                <div class="cert_type" v-if="item.type">{{ item.type }}</div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- Cursos -->
        <section class="section" v-if="courses && courses.length">
            <h2>Cursos</h2>
            <div class="badges-grid">
                <div v-for="(course, index) in courses" :key="index" class="cert_badge">
                    <a :href="course.href || '#'" target="_blank" rel="noopener noreferrer" class="cert_card">
                        <div class="cert_body">
                            <div class="cert_img_wrapper">
                                <img :src="course.logo" :alt="course.name" class="cert_img">
                            </div>
                            <div class="cert_container">
                                <div class="cert_name">{{ course.name }}</div>
                                <div class="cert_issuer" v-if="course.issuer">ISSUER: {{ course.issuer.toUpperCase() }}</div>
                                <div class="cert_type" v-if="course.type">{{ course.type }}</div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

    </div>

    <script src="js/base.js"></script>
    <script type="module">
        import { downloadResumePDF } from './js/download.js';

        document.getElementById('downloadPdfBtn').addEventListener('click', () => {
            downloadResumePDF('resume.json');
        });
    </script>
    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const profile = ref(null);
                const badges = ref([]);
                const academic = ref([]);
                const courses = ref([]);
                const isDarkMode = ref(false);

                const initScrollObserver = () => {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.style.opacity = '1';
                                entry.target.style.transform = 'translateY(0)';
                            }
                        });
                    }, { threshold: 0.1 });

                    document.querySelectorAll('.section').forEach((section) => {
                        section.style.opacity = '0';
                        section.style.transform = 'translateY(20px)';
                        section.style.transition = 'all 0.5s ease-out';
                        observer.observe(section);
                    });
                };

                const loadData = async () => {
                    try {
                        const response = await fetch('./data.json');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        let data = await response.json();
                        
                        if (data._default) {
                            const keys = Object.keys(data._default);
                            if (keys.length > 0) {
                                const firstRecord = data._default[keys[0]];
                                data = (firstRecord && firstRecord.profile) ? firstRecord : data._default;
                            }
                        }

                        profile.value = data.profile || null;
                        badges.value = Array.isArray(data.badges) ? data.badges : [];
                        academic.value = Array.isArray(data.academic) ? data.academic : [];
                        courses.value = Array.isArray(data.courses) ? data.courses : [];

                    } catch (error) {
                        console.error("Error al cargar datos:", error);
                    } finally {
                        await nextTick();
                        if (badges.value.length > 0) {
                            const credlyScript = document.createElement('script');
                            credlyScript.src = "https://cdn.credly.com/assets/utilities/embed.js";
                            credlyScript.async = true;
                            document.body.appendChild(credlyScript);
                        }
                        initScrollObserver();
                    }
                };

                const handleToggleTheme = () => {
                    if (typeof window.toggleTheme === 'function') {
                        window.toggleTheme();
                        isDarkMode.value = document.body.classList.contains('dark-mode');
                    }
                };

                onMounted(() => {
                    isDarkMode.value = localStorage.getItem('darkMode') === 'true';
                    loadData();
                });

                return {
                    profile,
                    badges,
                    academic,
                    courses,
                    isDarkMode,
                    handleToggleTheme
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
