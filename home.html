<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Personal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

  <div id="app" class="max-w-4xl mx-auto px-6 py-12">
    
    <section class="text-center py-20">
      <div class="relative w-32 h-32 mx-auto mb-6">
        <img :src="profileImg" alt="Foto de perfil" class="rounded-full w-full h-full object-cover border-4 border-indigo-500 shadow-lg">
      </div>
      <h1 class="text-4xl md:text-6xl font-extrabold mb-4">
        Hola, soy <span class="text-indigo-400">{{ name }}</span>
      </h1>
      <p class="text-xl text-slate-300 mb-8 max-w-xl mx-auto">
        {{ title }}
      </p>
      <div class="flex justify-center gap-4">
        <a href="#contacto" class="bg-indigo-600 hover:bg-indigo-700 font-semibold px-6 py-3 rounded-xl transition">Contactar</a>
        <a href="#proyectos" class="border border-slate-700 hover:bg-slate-800 font-semibold px-6 py-3 rounded-xl transition">Ver Proyectos</a>
      </div>
    </section>

    <section id="proyectos" class="py-12">
      <h2 class="text-3xl font-bold mb-8 text-center">Proyectos Destacados</h2>
      
      <div class="flex justify-center gap-3 mb-8">
        <button 
          v-for="cat in categories" 
          :key="cat"
          @click="selectedCategory = cat"
          :class="['px-4 py-2 rounded-lg text-sm font-medium transition', selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white']">
          {{ cat }}
        </button>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <div 
          v-for="project in filteredProjects" 
          :key="project.id" 
          class="bg-slate-800 border border-slate-700 rounded-2xl p-6 hover:-translate-y-1 transition duration-300">
          <h3 class="text-xl font-bold mb-2">{{ project.title }}</h3>
          <p class="text-slate-400 mb-4 text-sm">{{ project.description }}</p>
          <span class="inline-block bg-indigo-950 text-indigo-300 text-xs px-3 py-1 rounded-full font-mono">
            {{ project.category }}
          </span>
        </div>
      </div>
    </section>

  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const name = ref('Alex Morgan');
        const title = ref('Desarrollador Web & Diseñador UI/UX enfocado en experiencias digitales interactivas.');
        const profileImg = ref('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80');

        const categories = ref(['Todos', 'Web', 'Diseño', 'Mobile']);
        const selectedCategory = ref('Todos');

        const projects = ref([
          { id: 1, title: 'E-commerce App', category: 'Web', description: 'Plataforma de ventas en tiempo real construida con Vue y Firebase.' },
          { id: 2, title: 'Rediseño de Marca', category: 'Diseño', description: 'Sistema de diseño completo para startup tecnológica.' },
          { id: 3, title: 'App de Fitness', category: 'Mobile', description: 'Seguimiento de entrenamientos con gráficos interactivos.' }
        ]);

        const filteredProjects = computed(() => {
          if (selectedCategory.value === 'Todos') return projects.value;
          return projects.value.filter(p => p.category === selectedCategory.value);
        });

        return {
          name,
          title,
          profileImg,
          categories,
          selectedCategory,
          projects,
          filteredProjects
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
