<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Panel de administración de perfil">
    <meta name="author" content="Danny Vásconez">
    <title>Panel de Control | Danny Vásconez</title>
    
    <!-- Iconos y Estilos Generales -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="stylesheets/base.css">
    
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <style>
        /* Estilos del Dashboard y Formularios de Edición */
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .dashboard-title i {
            color: var(--accent-color);
        }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--accent-light);
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        /* Campos de Entrada */
        .edit-input, .edit-textarea {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-top: 0.3rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .edit-input:focus, .edit-textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .grid-3-col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .badge-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        /* Tarjetas de Edición Dinámicas */
        .card-edit-item {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .card-edit-item .btn-delete {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .nested-box {
            background: rgba(0, 0, 0, 0.02);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            padding: 0.8rem;
            margin-top: 0.8rem;
        }

        .dark-mode .nested-box {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Botones de Acción */
        .btn-action {
            padding: 0.5rem 0.9rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-add {
            background: var(--accent-light);
            color: var(--accent-color);
            margin-top: 0.5rem;
        }

        .btn-add:hover {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .btn {
            padding: 0.65rem 1.3rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .btn-danger:hover {
            background-color: #dc2626;
            color: #ffffff;
        }

        /* Indicadores de Carga y Notificaciones */
        .auth-loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            gap: 1rem;
            color: var(--text-secondary);
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--accent-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            background: #10b981;
            color: #fff;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .notification.error {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div id="app" class="container">

        <!-- Datalists Compartidos -->
        <datalist id="shared-types-list">
            <option v-for="(type, idx) in sharedTypes" :key="idx" :value="type"></option>
        </datalist>

        <datalist id="shared-issuers-list">
            <option v-for="(issuer, idx) in sharedIssuers" :key="idx" :value="issuer"></option>
        </datalist>

        <datalist id="images-list">
            <option v-for="(img, idx) in availableImages" :key="idx" :value="img"></option>
        </datalist>

        <!-- Menú Flotante Reutilizado -->
        <nav class="main-menu">
            <div class="nav-links">
                <a href="index.html">
                    <i class="bi bi-fingerprint"></i>
                    <span class="nav-text"> BIO</span>
                </a>
                <a href="resume.html">
                    <i class="bi bi-person-circle"></i>
                    <span class="nav-text"> CV</span>
                </a>
                <a href="dashboard.html" class="active">
                    <i class="bi bi-sliders"></i>
                    <span class="nav-text"> Dashboard</span>
                </a>
            </div>
            <button class="theme-toggle" @click="handleToggleTheme">
                <i :class="isDarkMode ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'"></i>
                <span class="nav-text">{{ isDarkMode ? 'Claro' : 'Oscuro' }}</span>
            </button>
        </nav>

        <!-- Pantalla de Carga / Verificación de Autenticación -->
        <div v-if="checkingAuth" class="auth-loader">
            <i class="bi bi-arrow-repeat spinner"></i>
            <p>Verificando sesión segura...</p>
        </div>

        <!-- Contenido Principal del Dashboard -->
        <div v-else-if="isAuthenticated" class="dashboard-container">
            
            <header class="dashboard-header">
                <div class="dashboard-title">
                    <h2><i class="bi bi-speedometer2"></i>Panel de Control</h2>
                </div>
                <button class="btn btn-danger" @click="handleLogout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </header>

            <!-- Navegación por Pestañas -->
            <div class="tabs-nav">
                <button 
                    :class="['tab-btn', { active: activeTab === 'bio' }]" 
                    @click="activeTab = 'bio'"
                >
                    <i class="bi bi-person-vcard"></i> Editar Bio
                </button>
                <button 
                    :class="['tab-btn', { active: activeTab === 'resume' }]" 
                    @click="activeTab = 'resume'"
                >
                    <i class="bi bi-file-earmark-text"></i> Editar CV
                </button>
            </div>

            <!-- PESTAÑA 1: EDITAR BIO -->
            <div v-if="activeTab === 'bio'">
                
                <!-- Datos Personales -->
                <section class="section">
                    <h2><i class="bi bi-person-lines-fill"></i> Datos Personales</h2>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Nombre Completo</label>
                        <input type="text" v-model="profile.name" class="edit-input" placeholder="Tu Nombre">
                    </div>
                    <div class="grid-2-col">
                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" v-model="profile.email" class="edit-input" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label>Enlace de LinkedIn</label>
                            <input type="url" v-model="profile.linkedin" class="edit-input" placeholder="https://linkedin.com/in/...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" v-model="profile.location" class="edit-input" placeholder="Ciudad, País">
                    </div>
                </section>

                <!-- Quién soy -->
                <section class="section">
                    <h2>Quién soy</h2>
                    <div class="form-group">
                        <label>Biografía / Descripción General</label>
                        <textarea v-model="profile.bio" class="edit-textarea" rows="4" placeholder="Escribe tu biografía..."></textarea>
                    </div>
                </section>

                <!-- Badges Credly -->
                <section class="section">
                    <h2>Badges (IDs de Credly)</h2>
                    <div v-for="(badge, index) in badges" :key="index" class="badge-input-group">
                        <input type="text" v-model="badges[index]" class="edit-input" placeholder="ID de la insignia">
                        <button type="button" class="btn-action btn-delete" @click="removeBadge(index)">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addBadge">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Badge
                    </button>
                </section>

                <!-- Academia -->
                <section class="section">
                    <h2>Academia</h2>
                    <div v-for="(item, index) in academic" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeAcademic(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Título / Carrera</label>
                                <input type="text" v-model="item.name" class="edit-input" placeholder="Nombre de la titulación">
                            </div>
                            <div class="form-group">
                                <label>Institución / Emisor</label>
                                <input type="text" v-model="item.issuer" list="shared-issuers-list" class="edit-input" placeholder="Universidad / Instituto">
                            </div>
                        </div>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>URL del Logo (Imagen)</label>
                                <input type="text" v-model="item.logo" list="images-list" class="edit-input" placeholder="images/logo.png">
                            </div>
                            <div class="form-group">
                                <label>Tipo / Grado</label>
                                <input type="text" v-model="item.type" list="shared-types-list" class="edit-input" placeholder="Selecciona o escribe un grado...">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Enlace Externo (Opcional)</label>
                            <input type="url" v-model="item.href" class="edit-input" placeholder="https://...">
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addAcademic">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Titulación
                    </button>
                </section>

                <!-- Cursos -->
                <section class="section">
                    <h2>Cursos y Certificaciones</h2>
                    <div v-for="(course, index) in courses" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeCourse(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Nombre del Curso</label>
                                <input type="text" v-model="course.name" class="edit-input" placeholder="Nombre del curso">
                            </div>
                            <div class="form-group">
                                <label>Emisor / Plataforma</label>
                                <input type="text" v-model="course.issuer" list="shared-issuers-list" class="edit-input" placeholder="Udemy, Coursera, etc.">
                            </div>
                        </div>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>URL del Logo</label>
                                <input type="text" v-model="course.logo" list="images-list" class="edit-input" placeholder="images/course.png">
                            </div>
                            <div class="form-group">
                                <label>Tipo / Categoría</label>
                                <input type="text" v-model="course.type" list="shared-types-list" class="edit-input" placeholder="Selecciona o escribe un tipo...">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Enlace al Certificado (Opcional)</label>
                            <input type="url" v-model="course.href" class="edit-input" placeholder="https://...">
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addCourse">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Curso
                    </button>
                </section>

                <div class="actions-bar">
                    <button type="button" class="btn btn-primary" @click="saveBioData" :disabled="isSaving">
                        <i class="bi" :class="isSaving ? 'bi-arrow-repeat spinner' : 'bi-floppy-fill'" style="font-size: 1rem;"></i>
                        <span>{{ isSaving ? 'Guardando Bio...' : 'Guardar Bio' }}</span>
                    </button>
                </div>

            </div>

            <!-- PESTAÑA 2: EDITAR RESUME (CV) -->
            <div v-if="activeTab === 'resume'">
                
                <!-- Perfil CV -->
                <section class="section">
                    <h2><i class="bi bi-person-badge"></i> Perfil CV</h2>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Nombre Completo</label>
                        <input type="text" v-model="resume.profile.name" class="edit-input" placeholder="Nombre">
                    </div>
                    <div class="grid-3-col">
                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" v-model="resume.profile.email" class="edit-input" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label>LinkedIn</label>
                            <input type="url" v-model="resume.profile.linkedin" class="edit-input" placeholder="https://linkedin.com/in/...">
                        </div>
                        <div class="form-group">
                            <label>Ubicación</label>
                            <input type="text" v-model="resume.profile.location" class="edit-input" placeholder="Ciudad, País">
                        </div>
                    </div>
                </section>

                <!-- Comités Técnicos ISO/INEN -->
                <section class="section">
                    <h2>Comités Técnicos ISO/INEN</h2>
                    <div v-for="(item, index) in resume.committees" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeCommittee(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Título del Comité</label>
                                <input type="text" v-model="item.title" class="edit-input" placeholder="Nombre o cargo en el comité">
                            </div>
                            <div class="form-group">
                                <label>Año / Período</label>
                                <input type="text" v-model="item.year" class="edit-input" placeholder="Ej: 2023">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Enlace del Documento de Respaldo</label>
                            <input type="url" v-model="item.link" class="edit-input" placeholder="https://...">
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addCommittee">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Comité
                    </button>
                </section>

                <!-- Experiencia Laboral -->
                <section class="section">
                    <h2>Experiencia Laboral</h2>
                    <div v-for="(exp, index) in resume.experience" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeExperience(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Cargo / Rol</label>
                                <input type="text" class="edit-input" v-model="exp.role" placeholder="Ej: Full Stack Developer" />
                            </div>
                            <div class="form-group">
                                <label>Empresa</label>
                                <input type="text" class="edit-input" v-model="exp.company" placeholder="Nombre de la empresa" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Período</label>
                            <input type="text" class="edit-input" v-model="exp.period" placeholder="Ej: 2021 - Presente" />
                        </div>
                        
                        <!-- Lista de Detalles/Logros -->
                        <div class="nested-box">
                            <label style="font-weight: 600; font-size: 0.85rem;">Detalles / Funciones</label>
                            <div v-for="(detail, dIdx) in exp.details" :key="dIdx" class="badge-input-group" style="margin-top: 0.5rem;">
                                <input type="text" v-model="detail.text" class="edit-input" placeholder="Descripción de la función">
                                <input type="url" v-model="detail.link" class="edit-input" style="max-width: 200px;" placeholder="URL Respaldo (opcional)">
                                <button type="button" class="btn-action btn-delete" @click="removeExperienceDetail(index, dIdx)">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                            <button type="button" class="btn-action btn-add" @click="addExperienceDetail(index)">
                                <i class="bi bi-plus-circle-fill"></i> Agregar Función
                            </button>
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addExperience">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Experiencia
                    </button>
                </section>

                <!-- Educación -->
                <section class="section">
                    <h2>Educación</h2>
                    <div v-for="(edu, index) in resume.education" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeEducation(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Título / Titulación</label>
                                <input type="text" class="edit-input" v-model="edu.name" placeholder="Ej: Ingeniería en Sistemas" />
                            </div>
                            <div class="form-group">
                                <label>Universidad / Institución</label>
                                <input type="text" class="edit-input" v-model="edu.university" placeholder="Nombre de la institución" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Período</label>
                            <input type="text" class="edit-input" v-model="edu.period" placeholder="Ej: 2015 - 2020" />
                        </div>

                        <!-- Detalles Educación -->
                        <div class="nested-box">
                            <label style="font-weight: 600; font-size: 0.85rem;">Detalles Adicionales</label>
                            <div v-for="(detail, dIdx) in edu.details" :key="dIdx" class="badge-input-group" style="margin-top: 0.5rem;">
                                <input type="text" v-model="edu.details[dIdx]" class="edit-input" placeholder="Detalle o logro">
                                <button type="button" class="btn-action btn-delete" @click="removeEducationDetail(index, dIdx)">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                            <button type="button" class="btn-action btn-add" @click="addEducationDetail(index)">
                                <i class="bi bi-plus-circle-fill"></i> Agregar Detalle
                            </button>
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addEducation">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Educación
                    </button>
                </section>

                <!-- Cursos y Certificados CV -->
                <section class="section">
                    <h2>Cursos y Certificados (CV)</h2>
                    <div v-for="(item, index) in resume.courses" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeResumeCourse(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="form-group">
                            <label>Descripción del Curso / Certificado</label>
                            <input type="text" class="edit-input" v-model="item.details" placeholder="Ej: Certificación AWS Cloud Practitioner" />
                        </div>
                        <div class="form-group">
                            <label>Enlace al Certificado (Opcional)</label>
                            <input type="url" class="edit-input" v-model="item.link" placeholder="https://..." />
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addResumeCourse">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Curso
                    </button>
                </section>

                <!-- Habilidades -->
                <section class="section">
                    <h2>Habilidades</h2>
                    <div v-for="(skill, index) in resume.skills" :key="index" class="badge-input-group">
                        <input type="text" v-model="resume.skills[index]" class="edit-input" placeholder="Ej: JavaScript / Docker">
                        <button type="button" class="btn-action btn-delete" @click="removeSkill(index)">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addSkill">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Habilidad
                    </button>
                </section>

                <!-- Idiomas -->
                <section class="section">
                    <h2>Idiomas</h2>
                    <div v-for="(lang, index) in resume.languages" :key="index" class="card-edit-item">
                        <button type="button" class="btn-action btn-delete" @click="removeLanguage(index)">
                            <i class="bi bi-trash-fill"></i> Borrar
                        </button>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <label>Idioma</label>
                                <input type="text" class="edit-input" v-model="lang.name" placeholder="Ej: Español / Inglés" />
                            </div>
                            <div class="form-group">
                                <label>Nivel (%)</label>
                                <input type="text" class="edit-input" v-model="lang.level" placeholder="Ej: 100% o 80%" />
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-action btn-add" @click="addLanguage">
                        <i class="bi bi-plus-circle-fill"></i> Agregar Idioma
                    </button>
                </section>

                <!-- Botón para Guardar Resume -->
                <div class="actions-bar">
                    <button type="button" class="btn btn-primary" @click="saveResumeData" :disabled="isSaving">
                        <i class="bi" :class="isSaving ? 'bi-arrow-repeat spinner' : 'bi-floppy-fill'" style="font-size: 1rem;"></i>
                        <span>{{ isSaving ? 'Guardando CV...' : 'Guardar CV' }}</span>
                    </button>
                </div>

            </div>

        </div>

        <!-- Notificación Emergente -->
        <div v-if="toast.show" class="notification" :class="{ error: toast.isError }">
            <i class="bi" :class="toast.isError ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill'"></i>
            {{ toast.message }}
        </div>

    </div>

    <!-- Script de la Aplicación -->
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                // Endpoints
                const API_STATUS_URL = 'https://api.vasconez.work/status';
                const API_BIO_URL = 'https://api.vasconez.work/bio';
                const API_RESUME_URL = 'https://api.vasconez.work/resume';
                const API_IMAGES_URL = 'https://api.vasconez.work/images';
                const API_LOGOUT_URL = 'https://api.vasconez.work/logout';

                // Estados de la app
                const checkingAuth = ref(true);
                const isAuthenticated = ref(false);
                const isDarkMode = ref(false);
                const isSaving = ref(false);
                const activeTab = ref('bio'); // 'bio' | 'resume'
                const toast = ref({ show: false, message: '', isError: false });

                // Datos de Bio
                const profile = ref({ name: '', email: '', linkedin: '', location: '', bio: '' });
                const badges = ref([]);
                const academic = ref([]);
                const courses = ref([]);
                const serverImages = ref([]);

                // Estrutura Completa de Resume
                const resume = ref({
                    profile: { name: '', email: '', linkedin: '', location: '' },
                    committees: [],
                    experience: [],
                    education: [],
                    courses: [],
                    skills: [],
                    languages: []
                });

                // --- Datalists Computados ---
                const availableImages = computed(() => {
                    const academicLogos = academic.value.map(i => i.logo ? i.logo.trim() : '');
                    const courseLogos = courses.value.map(c => c.logo ? c.logo.trim() : '');
                    const allImages = [...serverImages.value, ...academicLogos, ...courseLogos].filter(img => img !== '');
                    return [...new Set(allImages)];
                });

                const sharedTypes = computed(() => {
                    const academicTypes = academic.value.map(item => item.type ? item.type.trim() : '');
                    const courseTypes = courses.value.map(item => item.type ? item.type.trim() : '');
                    return [...new Set([...academicTypes, ...courseTypes].filter(t => t !== ''))];
                });

                const sharedIssuers = computed(() => {
                    const academicIssuers = academic.value.map(item => item.issuer ? item.issuer.trim() : '');
                    const courseIssuers = courses.value.map(item => item.issuer ? item.issuer.trim() : '');
                    return [...new Set([...academicIssuers, ...courseIssuers].filter(i => i !== ''))];
                });

                // --- Manejo de Notificaciones ---
                const showToast = (message, isError = false) => {
                    toast.value = { show: true, message, isError };
                    setTimeout(() => { toast.value.show = false; }, 3000);
                };

                // --- Manejo de Tema Claro/Oscuro ---
                const applyTheme = (darkMode) => {
                    isDarkMode.value = darkMode;
                    document.body.classList.toggle('dark-mode', darkMode);
                    localStorage.setItem('darkMode', darkMode);
                };

                const handleToggleTheme = () => {
                    applyTheme(!isDarkMode.value);
                };

                // --- Verificación de Sesión (POST /status) ---
                const checkAuthStatus = async () => {
                    try {
                        const response = await fetch(API_STATUS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include'
                        });

                        if (response.status === 200) {
                            isAuthenticated.value = true;
                            checkingAuth.value = false;
                            loadDashboardData();
                        } else {
                            window.location.href = 'login.html';
                        }
                    } catch (error) {
                        console.error('Error al verificar sesión:', error);
                        window.location.href = 'login.html';
                    }
                };

                // --- Cargar Imágenes del Servidor ---
                const loadImages = async () => {
                    try {
                        const res = await fetch(API_IMAGES_URL, { credentials: 'include' });
                        if (res.ok) {
                            const files = await res.json();
                            if (Array.isArray(files)) {
                                serverImages.value = files.map(file => file.startsWith('images/') ? file : `images/${file}`);
                            }
                        }
                    } catch (e) {
                        console.warn('No se pudo obtener la lista de imágenes:', e);
                    }
                };

                // --- Cargar Información del Dashboard ---
                const loadDashboardData = async () => {
                    loadImages();

                    // Cargar Bio
                    try {
                        const bioRes = await fetch(API_BIO_URL, { credentials: 'include' });
                        if (bioRes.ok) {
                            let data = await bioRes.json();
                            if (data._default) {
                                const keys = Object.keys(data._default);
                                if (keys.length > 0) {
                                    const firstRecord = data._default[keys[0]];
                                    data = (firstRecord && firstRecord.profile) ? firstRecord : data._default;
                                }
                            }
                            if (data.profile) Object.assign(profile.value, data.profile);
                            badges.value = Array.isArray(data.badges) ? data.badges : [];
                            academic.value = Array.isArray(data.academic) ? data.academic : [];
                            courses.value = Array.isArray(data.courses) ? data.courses : [];
                        }
                    } catch (err) {
                        console.warn('Error al cargar datos de Bio:', err);
                    }

                    // Cargar Resume
                    try {
                        const resumeRes = await fetch(API_RESUME_URL, { credentials: 'include' });
                        if (resumeRes.ok) {
                            const data = await resumeRes.json();
                            resume.value = {
                                profile: data.profile || { name: '', email: '', linkedin: '', location: '' },
                                committees: Array.isArray(data.committees) ? data.committees : [],
                                experience: Array.isArray(data.experience) ? data.experience : [],
                                education: Array.isArray(data.education) ? data.education : [],
                                courses: Array.isArray(data.courses) ? data.courses : [],
                                skills: Array.isArray(data.skills) ? data.skills : [],
                                languages: Array.isArray(data.languages) ? data.languages : []
                            };
                        }
                    } catch (err) {
                        console.warn('Error al cargar datos de Resume:', err);
                    }
                };

                // --- Métodos de Edición de Bio ---
                const addBadge = () => badges.value.push('');
                const removeBadge = (index) => badges.value.splice(index, 1);

                const addAcademic = () => {
                    academic.value.push({ name: '', issuer: '', logo: '', type: '', href: '' });
                };
                const removeAcademic = (index) => academic.value.splice(index, 1);

                const addCourse = () => {
                    courses.value.push({ name: '', issuer: '', logo: '', type: '', href: '' });
                };
                const removeCourse = (index) => courses.value.splice(index, 1);

                const saveBioData = async () => {
                    isSaving.value = true;
                    const payload = {
                        profile: profile.value,
                        badges: badges.value.filter(id => id && id.trim() !== ''),
                        academic: academic.value,
                        courses: courses.value
                    };

                    try {
                        const response = await fetch(API_BIO_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        showToast('¡Biografía guardada con éxito!');
                    } catch (error) {
                        console.error('Error al guardar Bio:', error);
                        showToast('Error al guardar información en el servidor', true);
                    } finally {
                        isSaving.value = false;
                    }
                };

                // --- Métodos de Edición de Resume ---
                const addCommittee = () => {
                    resume.value.committees.push({ title: '', year: '', link: '' });
                };
                const removeCommittee = (index) => {
                    resume.value.committees.splice(index, 1);
                };

                const addExperience = () => {
                    resume.value.experience.push({ role: '', company: '', period: '', details: [] });
                };
                const removeExperience = (index) => {
                    resume.value.experience.splice(index, 1);
                };

                const addExperienceDetail = (expIndex) => {
                    if (!resume.value.experience[expIndex].details) {
                        resume.value.experience[expIndex].details = [];
                    }
                    resume.value.experience[expIndex].details.push({ text: '', link: '' });
                };
                const removeExperienceDetail = (expIndex, dIndex) => {
                    resume.value.experience[expIndex].details.splice(dIndex, 1);
                };

                const addEducation = () => {
                    resume.value.education.push({ name: '', university: '', period: '', details: [] });
                };
                const removeEducation = (index) => {
                    resume.value.education.splice(index, 1);
                };

                const addEducationDetail = (eduIndex) => {
                    if (!resume.value.education[eduIndex].details) {
                        resume.value.education[eduIndex].details = [];
                    }
                    resume.value.education[eduIndex].details.push('');
                };
                const removeEducationDetail = (eduIndex, dIndex) => {
                    resume.value.education[eduIndex].details.splice(dIndex, 1);
                };

                const addResumeCourse = () => {
                    resume.value.courses.push({ details: '', link: '' });
                };
                const removeResumeCourse = (index) => {
                    resume.value.courses.splice(index, 1);
                };

                const addSkill = () => {
                    resume.value.skills.push('');
                };
                const removeSkill = (index) => {
                    resume.value.skills.splice(index, 1);
                };

                const addLanguage = () => {
                    resume.value.languages.push({ name: '', level: '100%' });
                };
                const removeLanguage = (index) => {
                    resume.value.languages.splice(index, 1);
                };

                const saveResumeData = async () => {
                    isSaving.value = true;
                    try {
                        const response = await fetch(API_RESUME_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(resume.value)
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        showToast('¡CV actualizado con éxito!');
                    } catch (error) {
                        console.error('Error al guardar Resume:', error);
                        showToast('Error al guardar el CV en el servidor', true);
                    } finally {
                        isSaving.value = false;
                    }
                };

                // --- Cerrar Sesión ---
                const handleLogout = async () => {
                    try {
                        await fetch(API_LOGOUT_URL, {
                            method: 'POST',
                            credentials: 'include'
                        });
                    } catch (e) {
                        console.error('Error al cerrar sesión:', e);
                    } finally {
                        window.location.href = 'login.html';
                    }
                };

                // --- Ciclo de Vida ---
                onMounted(() => {
                    const savedTheme = localStorage.getItem('darkMode');
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    applyTheme(savedTheme !== null ? savedTheme === 'true' : prefersDark);

                    // Verificar estado de la sesión mediante POST
                    checkAuthStatus();
                });

                return {
                    checkingAuth,
                    isAuthenticated,
                    isDarkMode,
                    isSaving,
                    activeTab,
                    toast,
                    profile,
                    badges,
                    academic,
                    courses,
                    resume,
                    availableImages,
                    sharedTypes,
                    sharedIssuers,
                    handleToggleTheme,
                    addBadge,
                    removeBadge,
                    addAcademic,
                    removeAcademic,
                    addCourse,
                    removeCourse,
                    saveBioData,
                    addCommittee,
                    removeCommittee,
                    addExperience,
                    removeExperience,
                    addExperienceDetail,
                    removeExperienceDetail,
                    addEducation,
                    removeEducation,
                    addEducationDetail,
                    removeEducationDetail,
                    addResumeCourse,
                    removeResumeCourse,
                    addSkill,
                    removeSkill,
                    addLanguage,
                    removeLanguage,
                    saveResumeData,
                    handleLogout
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
