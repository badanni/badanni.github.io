<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Panel de administración de perfil">
    <meta name="author" content="Danny Vásconez">
    <title>Panel de Control | Danny Vásconez</title>
    
    <!-- Iconos y Estilos Generales -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="stylesheets/base.css">
    
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <style>
        /* Estilos del Dashboard */
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .dashboard-title i {
            color: var(--accent-color);
        }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--accent-light);
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        /* Formularios */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Tarjetas dinámicas para Experiencia / Educación */
        .dynamic-item {
            position: relative;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }

        body.dark-mode .dynamic-item {
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-delete-item {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .btn-delete-item:hover {
            background: rgba(220, 38, 38, 0.1);
        }

        /* Botones de acción */
        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .btn {
            padding: 0.65rem 1.3rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        .btn-secondary:hover {
            opacity: 0.85;
        }

        .btn-danger {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .btn-danger:hover {
            background-color: #dc2626;
            color: #ffffff;
        }

        /* Indicadores de Estado y Alertas */
        .auth-loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            gap: 1rem;
            color: var(--text-secondary);
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--accent-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .alert-banner {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-error {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }
    </style>
</head>
<body>
    <div id="app" class="container">

        <!-- Menú Flotante Reutilizado -->
        <nav class="main-menu">
            <div class="nav-links">
                <a href="index.html">
                    <i class="bi bi-fingerprint"></i>
                    <span class="nav-text"> BIO</span>
                </a>
                <a href="resume.html">
                    <i class="bi bi-person-circle"></i>
                    <span class="nav-text"> CV</span>
                </a>
                <a href="dashboard.html" class="active">
                    <i class="bi bi-sliders"></i>
                    <span class="nav-text"> Dashboard</span>
                </a>
            </div>
            <button class="theme-toggle" @click="handleToggleTheme">
                <i :class="isDarkMode ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'"></i>
                <span class="nav-text">{{ isDarkMode ? 'Claro' : 'Oscuro' }}</span>
            </button>
        </nav>

        <!-- Pantalla de Carga / Verificación de Estado -->
        <div v-if="checkingAuth" class="auth-loader">
            <i class="bi bi-arrow-repeat spinner"></i>
            <p>Verificando sesión segura...</p>
        </div>

        <!-- Contenido Principal del Dashboard (Solo si está autenticado) -->
        <div v-else-if="isAuthenticated" class="dashboard-container">
            
            <header class="dashboard-header">
                <div class="dashboard-title">
                    <i class="bi bi-speedometer2"></i>
                    <h2>Panel de Administración</h2>
                </div>
                <button class="btn btn-danger" @click="handleLogout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </header>

            <!-- Mensaje de Notificación -->
            <div v-if="statusMessage.text" :class="['alert-banner', statusMessage.type === 'success' ? 'alert-success' : 'alert-error']">
                <i :class="statusMessage.type === 'success' ? 'bi bi-check-circle-fill' : 'bi bi-exclamation-triangle-fill'"></i>
                <span>{{ statusMessage.text }}</span>
            </div>

            <!-- Navegación de Pestañas -->
            <div class="tabs-nav">
                <button 
                    :class="['tab-btn', { active: activeTab === 'bio' }]" 
                    @click="activeTab = 'bio'"
                >
                    <i class="bi bi-person-vcard"></i> Editar Bio
                </button>
                <button 
                    :class="['tab-btn', { active: activeTab === 'resume' }]" 
                    @click="activeTab = 'resume'"
                >
                    <i class="bi bi-file-earmark-text"></i> Editar Resume (CV)
                </button>
            </div>

            <!-- PESTAÑA 1: EDITAR BIO -->
            <section v-if="activeTab === 'bio'" class="section">
                <h2>Información Biográfica</h2>
                <form @submit.prevent="saveBio">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" class="form-control" v-model="bio.name" required />
                        </div>

                        <div class="form-group">
                            <label>Título Profesional</label>
                            <input type="text" class="form-control" v-model="bio.title" placeholder="Ej: Senior Software Engineer" />
                        </div>

                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" class="form-control" v-model="bio.email" />
                        </div>

                        <div class="form-group">
                            <label>Ubicación</label>
                            <input type="text" class="form-control" v-model="bio.location" placeholder="Ej: Quito, Ecuador" />
                        </div>

                        <div class="form-group">
                            <label>GitHub (URL)</label>
                            <input type="url" class="form-control" v-model="bio.github" />
                        </div>

                        <div class="form-group">
                            <label>LinkedIn (URL)</label>
                            <input type="url" class="form-control" v-model="bio.linkedin" />
                        </div>

                        <div class="form-group full-width">
                            <label>Extracto / Acerca de mí</label>
                            <textarea class="form-control" v-model="bio.about" rows="4" placeholder="Breve descripción personal..."></textarea>
                        </div>
                    </div>

                    <div class="actions-bar">
                        <button type="submit" class="btn btn-primary" :disabled="isSaving">
                            <i v-if="isSaving" class="bi bi-arrow-repeat spinner" style="font-size: 1rem;"></i>
                            <i v-else class="bi bi-floppy"></i>
                            <span>{{ isSaving ? 'Guardando...' : 'Guardar Bio' }}</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- PESTAÑA 2: EDITAR RESUME (CV) -->
            <section v-if="activeTab === 'resume'" class="section">
                <h2>Experiencia Laboral</h2>
                
                <div v-for="(exp, index) in resume.experiences" :key="index" class="dynamic-item">
                    <button type="button" class="btn-delete-item" @click="removeExperience(index)" title="Eliminar este ítem">
                        <i class="bi bi-trash"></i>
                    </button>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Cargo / Rol</label>
                            <input type="text" class="form-control" v-model="exp.role" required />
                        </div>
                        <div class="form-group">
                            <label>Empresa</label>
                            <input type="text" class="form-control" v-model="exp.company" required />
                        </div>
                        <div class="form-group">
                            <label>Período</label>
                            <input type="text" class="form-control" v-model="exp.period" placeholder="Ej: 2021 - Presente" />
                        </div>
                        <div class="form-group full-width">
                            <label>Logros y Responsabilidades (un punto por línea)</label>
                            <textarea class="form-control" v-model="exp.details" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-secondary" @click="addExperience">
                    <i class="bi bi-plus-circle"></i> Agregar Experiencia
                </button>

                <h2 style="margin-top: 2.5rem;">Habilidades Tecnológicas</h2>
                <div class="form-group full-width">
                    <label>Habilidades (separadas por coma)</label>
                    <input type="text" class="form-control" v-model="resume.skills" placeholder="Ej: Vue.js, Node.js, Python, Docker, PostgreSQL" />
                </div>

                <div class="actions-bar">
                    <button type="button" class="btn btn-primary" @click="saveResume" :disabled="isSaving">
                        <i v-if="isSaving" class="bi bi-arrow-repeat spinner" style="font-size: 1rem;"></i>
                        <i v-else class="bi bi-floppy"></i>
                        <span>{{ isSaving ? 'Guardando...' : 'Guardar CV' }}</span>
                    </button>
                </div>
            </section>

        </div>

    </div>

    <!-- Script de la Aplicación -->
    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                // Estados de Autenticación y Carga
                const checkingAuth = ref(true);
                const isAuthenticated = ref(false);
                const isDarkMode = ref(false);
                const isSaving = ref(false);
                
                // Navegación interna
                const activeTab = ref('bio'); // 'bio' | 'resume'

                // Mensajes emergentes
                const statusMessage = ref({ text: '', type: '' });

                // Modelos de datos
                const bio = ref({
                    name: '',
                    title: '',
                    email: '',
                    location: '',
                    github: '',
                    linkedin: '',
                    about: ''
                });

                const resume = ref({
                    experiences: [],
                    skills: ''
                });

                // --- Control del Modo Oscuro ---
                const applyTheme = (darkMode) => {
                    isDarkMode.value = darkMode;
                    if (darkMode) {
                        document.body.classList.add('dark-mode');
                    } else {
                        document.body.classList.remove('dark-mode');
                    }
                    localStorage.setItem('darkMode', darkMode);
                };

                const handleToggleTheme = () => {
                    applyTheme(!isDarkMode.value);
                };

                const showNotification = (text, type = 'success') => {
                    statusMessage.value = { text, type };
                    setTimeout(() => {
                        statusMessage.value = { text: '', type: '' };
                    }, 4000);
                };

                // --- Verificación de Estado (POST /status) ---
                const checkAuthStatus = async () => {
                    try {
                        const response = await fetch('https://api.vasconez.work/status', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include' // Enviar cookies de sesión
                        });

                        if (response.status === 200) {
                            isAuthenticated.value = true;
                            checkingAuth.value = false;
                            // Cargar datos del dashboard una vez autenticado
                            loadDashboardData();
                        } else {
                            // Si es 401 u otro código no exitoso, redirigir a login
                            window.location.href = 'login.html';
                        }
                    } catch (error) {
                        console.error('Error de verificación de estado:', error);
                        window.location.href = 'login.html';
                    }
                };

                // --- Cargar Datos del Servidor ---
                const loadDashboardData = async () => {
                    try {
                        // Carga opcional de datos existentes si la API provee endpoints GET
                        const bioRes = await fetch('https://api.vasconez.work/bio', { credentials: 'include' });
                        if (bioRes.ok) bio.value = await bioRes.json();

                        const resumeRes = await fetch('https://api.vasconez.work/resume', { credentials: 'include' });
                        if (resumeRes.ok) resume.value = await resumeRes.json();
                    } catch (err) {
                        console.warn('No se pudieron obtener datos iniciales de la API:', err);
                    }
                };

                // --- Guardar Información de Bio ---
                const saveBio = async () => {
                    isSaving.value = true;
                    try {
                        const response = await fetch('https://api.vasconez.work/bio', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(bio.value)
                        });

                        if (!response.ok) throw new Error('Error al actualizar la información de la Bio');

                        showNotification('Biografía actualizada exitosamente.');
                    } catch (error) {
                        showNotification(error.message, 'error');
                    } finally {
                        isSaving.value = false;
                    }
                };

                // --- Guardar Información de Resume ---
                const saveResume = async () => {
                    isSaving.value = true;
                    try {
                        const response = await fetch('https://api.vasconez.work/resume', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(resume.value)
                        });

                        if (!response.ok) throw new Error('Error al actualizar el Resume');

                        showNotification('Resume actualizado exitosamente.');
                    } catch (error) {
                        showNotification(error.message, 'error');
                    } finally {
                        isSaving.value = false;
                    }
                };

                // --- Métodos dinámicos para Experiencias ---
                const addExperience = () => {
                    resume.value.experiences.push({
                        role: '',
                        company: '',
                        period: '',
                        details: ''
                    });
                };

                const removeExperience = (index) => {
                    resume.value.experiences.splice(index, 1);
                };

                // --- Cerrar Sesión ---
                const handleLogout = async () => {
                    try {
                        await fetch('https://api.vasconez.work/logout', {
                            method: 'POST',
                            credentials: 'include'
                        });
                    } catch (e) {
                        console.error('Error al cerrar sesión', e);
                    } finally {
                        window.location.href = 'login.html';
                    }
                };

                // --- Ciclo de Vida ---
                onMounted(() => {
                    // Cargar tema visual inicial
                    const savedTheme = localStorage.getItem('darkMode');
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    applyTheme(savedTheme !== null ? savedTheme === 'true' : prefersDark);

                    // Verificar autenticación mediante POST a status
                    checkAuthStatus();
                });

                return {
                    checkingAuth,
                    isAuthenticated,
                    isDarkMode,
                    activeTab,
                    statusMessage,
                    isSaving,
                    bio,
                    resume,
                    handleToggleTheme,
                    saveBio,
                    saveResume,
                    addExperience,
                    removeExperience,
                    handleLogout
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
